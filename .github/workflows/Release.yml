name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

env:
  flutter_channel: 'stable'
  flutter_version: '3.47.0'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - check_release
      - build_release_assets
      - send_to_community
    steps:
      - run: exit 0

  check_release:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check release
        run: bash scripts/github_release.sh check-release

  build_release_assets:
    name: Build release assets
    needs:
      - check_release
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: windows
            host: windows-latest
          - target: macos
            host: macos-latest
          - target: linux
            host: ubuntu-latest
          - target: ios
            host: macos-latest
          - target: android
            host: ubuntu-latest

    runs-on: ${{ matrix.config.host }}

    env:
      TARGET: ${{ matrix.config.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - id: check_asset
        name: Check asset
        shell: bash
        run: bash scripts/github_release.sh check-asset

      - name: Setup flutter
        if: steps.check_asset.outputs.skip_build != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.flutter_channel }}
          flutter-version: ${{ env.flutter_version }}

      - name: Setup rust
        if: steps.check_asset.outputs.skip_build != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Clear rust
        if: steps.check_asset.outputs.skip_build != 'true'
        shell: bash
        run: rm -rf rust

      - name: Check core
        if: steps.check_asset.outputs.skip_build != 'true'
        uses: actions/checkout@v3
        with:
          repository: 'niuhuan/wax-go-core'
          token: ${{ secrets.GH_TOKEN }}
          path: 'rust'

      - name: Cache cargo
        if: steps.check_asset.outputs.skip_build != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Flutter dependencies (Linux/Android)
        if: steps.check_asset.outputs.skip_build != 'true' && ( matrix.config.target == 'android' || matrix.config.target == 'linux' )
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-${{ env.flutter_version }}

      - name: Cache Flutter dependencies (Mac host)
        if: steps.check_asset.outputs.skip_build != 'true' && ( matrix.config.target == 'ios' || matrix.config.target == 'macos' )
        uses: actions/cache@v3
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-${{ env.flutter_version }}

      - name: Cache Gradle dependencies (Android)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'android'
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup java (Android)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Install dependencies (Linux)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2
          curl -JOL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod a+x appimagetool-x86_64.AppImage
          mkdir -p "${GITHUB_WORKSPACE}/bin"
          mv appimagetool-x86_64.AppImage "${GITHUB_WORKSPACE}/bin/appimagetool"
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      - name: Flutter pub get
        if: steps.check_asset.outputs.skip_build != 'true'
        run: flutter pub get

      - name: Build (windows)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'windows'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\build.zip

      - name: Build (macos)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'macos'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          hdiutil create -volname wax -srcfolder build/macos/Build/Products/Release/wax.app -ov -format UDZO build/build.dmg

      - name: Build (linux)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'linux'
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
          APPDIR=build/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr"
          cp -a build/linux/x64/release/bundle/. "$APPDIR/usr/"
          cp lib/assets/icon.png "$APPDIR/wax.png"
          printf '%s\n' '[Desktop Entry]' 'Name=wax' 'Exec=wax' 'Icon=wax' 'Type=Application' 'Categories=Utility;' > "$APPDIR/wax.desktop"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH}"' 'exec "$HERE/usr/wax" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          appimagetool "$APPDIR" build/build.AppImage

      - name: Append application-identifier (ios)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'ios'
        run: |
          /usr/libexec/PlistBuddy -c 'Add :application-identifier string niuhuan.wax' ios/Runner/Info.plist

      - name: Build (ios)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -9 -r nosign.ipa Payload

      - name: Build (android)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'android'
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Sign APK (Android)
        if: steps.check_asset.outputs.skip_build != 'true' && matrix.config.target == 'android'
        env:
          KEY_FILE_BASE64: ${{ secrets.KEY_FILE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEY_FILE_BASE64" | base64 -d > key.jks
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/build-tools/*/apksigner' | sort | tail -n 1)"
          printf '%s\n%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" | "$APKSIGNER" sign --ks key.jks --ks-key-alias wax22sign --ks-pass stdin --key-pass stdin build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Asset (All)
        if: steps.check_asset.outputs.skip_build != 'true'
        shell: bash
        run: bash scripts/github_release.sh upload-asset


  send_to_community:
    needs:
      - check_release
      - build_release_assets
    name: Send message to community
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
